kind = "web"
previewPath = "/store/"
title = "E-Commerce Store"
version = "1.0.0"
id = "artifacts/ecommerce-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/store/" ]
localPort = 20556

[services.development]
run = "pnpm --filter @workspace/ecommerce-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecommerce-store", "run", "build" ]
publicDir = "artifacts/ecommerce-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20556"
BASE_PATH = "/store/"
